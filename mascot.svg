<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur">
        <animate attributeName="stdDeviation" values="1;2.5;1" dur="3s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    .ascii-art {
      fill:rgb(131, 131, 131);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 5px; 
      line-height: 1;
      filter: url(#glow);
    }

    .float-group {
      animation: floating 4s ease-in-out infinite;
    }
    @keyframes floating {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>

  <g class="float-group">
    <text x="50%" y="20" text-anchor="middle" class="ascii-art" xml:space="preserve">
          <tspan x="50" dy="0">    ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄   </tspan>
    <tspan x="50" dy="1.3em"> ▄████████████████████▄</tspan>
    <tspan x="50" dy="1.3em">▐██████████████████████</tspan>
    <tspan x="50" dy="1.3em">███████████████████████</tspan>
    <tspan x="50" dy="1.3em"> ▐█████       █████ ███</tspan>
    <tspan x="50" dy="1.3em"> ▐▓▓▓▓▓       ▓▓▓▓▓ ███</tspan>
    <tspan x="50" dy="1.3em"> ▐▒▒▒▒▒       ▒▒▒▒▒ ▓▓▓</tspan>
    <tspan x="50" dy="1.3em">  █░░░    _    ░░░  ▓▓▓</tspan>
    <tspan x="50" dy="1.3em">  ▓▄───────────────┘▒▒ </tspan>
    <tspan x="50" dy="1.3em">  ▓                 ░</tspan>
    </text>
  </g>
</svg>